<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#310c2b"><title>Un recuerdo de amor</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Georgia,'Times New Roman',serif}body{background:#100711;color:#ffe1a2;min-height:100svh;display:grid;place-items:center;padding:12px}.tarjeta{width:min(100%,530px);height:min(820px,calc(100svh - 24px));min-height:480px;background:radial-gradient(ellipse at 50% 12%,#552046 0%,#310c2b 58%,#24091f 100%);border:1px solid #9b5c6a;border-radius:24px;box-shadow:0 14px 45px #0009;overflow:hidden;display:flex;flex-direction:column}.ventana{flex:1;overflow:hidden;touch-action:pan-y;min-height:0}.pista{height:100%;display:flex;transition:transform .42s cubic-bezier(.2,.75,.2,1)}.pantalla{flex:0 0 100%;width:100%;height:100%;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:24px 22px;gap:20px}.ramo{display:block;width:100%;max-width:450px;height:clamp(170px,34vh,290px);object-fit:cover;border-radius:18px;box-shadow:0 12px 35px #120512aa}.recuerdo{font-style:italic;font-size:clamp(27px,6.5vw,39px);line-height:1.18;margin:0;color:#ffe1a2}.separador{width:110px;height:1px;background:linear-gradient(90deg,transparent,#e6ae50,transparent)}.foto{display:block;max-width:100%;max-height:min(62svh,580px);height:auto;width:auto;object-fit:contain;border-radius:12px;box-shadow:0 8px 25px #120512bb}.monograma{display:block;width:100%;max-height:72svh;object-fit:contain;border-radius:14px;box-shadow:0 8px 28px #12051288}.mensaje{font-size:clamp(28px,6vw,40px);font-style:italic;line-height:1.1;margin:0}.corazon{font-size:26px;color:#e6ae50;line-height:1}.controles{display:flex;align-items:center;justify-content:center;gap:20px;padding:12px 10px 18px}.flecha{background:transparent;border:1px solid #c88d76;color:#ffe1a2;border-radius:100%;height:38px;width:38px;font-size:22px;cursor:pointer}.flecha:disabled{opacity:.28;cursor:default}.puntos{display:flex;gap:11px}.punto{height:10px;width:10px;border:1px solid #e6ae50;background:transparent;border-radius:50%;padding:0;cursor:pointer}.punto[aria-current="step"]{background:#e6ae50}.ayuda{font-family:Arial,sans-serif;font-size:12px;color:#edc8d8;text-align:center;padding:0 12px 13px}@media(max-height:650px){.pantalla{gap:12px;padding:14px}.ramo{height:150px}.foto{max-height:50svh}.controles{padding:5px}.ayuda{padding-bottom:7px}}@media(prefers-reduced-motion:reduce){.pista{transition:none}}

/* Acabado editorial: veladuras, luz ambiental y bordes integrados */
.tarjeta{position:relative;background:radial-gradient(ellipse at 18% 13%,#843957a6,transparent 47%),radial-gradient(ellipse at 85% 82%,#a33d6755,transparent 47%),linear-gradient(145deg,#451331,#20091f 65%,#3b1230);border:1px solid #e4aa7199;box-shadow:0 0 0 2px #6e3455,0 22px 65px #000b,inset 0 0 48px #c37d4c18}
.tarjeta:before{content:"";position:absolute;inset:8px;border:1px solid #d9a75a55;border-radius:18px;pointer-events:none;z-index:5}
.pantalla{position:relative;isolation:isolate;overflow:hidden}
.pantalla:before{content:"";position:absolute;inset:-10%;z-index:-1;pointer-events:none;background:radial-gradient(ellipse at 50% 38%,#c66b7c24,transparent 60%),radial-gradient(ellipse at 48% 84%,#e6ae5015,transparent 44%)}
.pantalla:after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,#24091f00 72%,#21071a60 100%)}
.ramo{height:clamp(280px,54vh,510px);max-width:470px;object-fit:contain;object-position:center;box-shadow:none;border-radius:0;-webkit-mask-image:radial-gradient(ellipse 67% 58% at 50% 47%,#000 57%,transparent 100%);mask-image:radial-gradient(ellipse 67% 58% at 50% 47%,#000 57%,transparent 100%);filter:drop-shadow(0 0 24px #e5a35445) saturate(1.1)}
.recuerdo,.mensaje{text-shadow:0 2px 15px #e9b76b6b,0 4px 28px #000b;letter-spacing:.015em}
.separador{height:2px;background:linear-gradient(90deg,transparent,#e6ae50b0,transparent);box-shadow:0 0 12px #e6ae5060}
.foto{border-radius:3px;max-height:min(62svh,600px);border:2px solid #e9bc7f9c;box-shadow:0 0 0 7px #5b234b80,0 0 34px #f1b57233,0 17px 40px #0008;-webkit-mask-image:linear-gradient(to bottom,transparent 0%,#000 5%,#000 92%,transparent 100%);mask-image:linear-gradient(to bottom,transparent 0%,#000 5%,#000 92%,transparent 100%)}
.monograma{max-height:74svh;border-radius:0;box-shadow:none;-webkit-mask-image:radial-gradient(ellipse 69% 70% at 50% 50%,#000 68%,transparent 100%);mask-image:radial-gradient(ellipse 69% 70% at 50% 50%,#000 68%,transparent 100%);filter:drop-shadow(0 0 16px #e7a96044)}
.controles,.ayuda{position:relative;z-index:6}
@media(max-height:650px){.ramo{height:clamp(150px,32vh,230px)}.foto{max-height:45svh}}
</style>
</head>
<body><main class="tarjeta" aria-label="Tarjeta romántica de tres pantallas"><div class="ventana" id="ventana"><div class="pista" id="pista">
<section class="pantalla" aria-label="Primera pantalla: Un recuerdo de amor"><img class="ramo" src="gerberas_difuminadas.jpg" alt="Ramo de gerberas naranjas, rosas y fucsias"><div class="separador"></div><h1 class="recuerdo">Un recuerdo de amor</h1><div class="separador"></div></section>
<section class="pantalla" aria-label="Segunda pantalla: fotografía y dedicatoria"><img class="foto" src="boda_difuminada.jpg" alt="Fotografía original de nuestra boda"><h2 class="mensaje">Te amo, princesa.</h2><div class="corazon" aria-hidden="true">♡</div></section>
<section class="pantalla" aria-label="Tercera pantalla: iniciales E y F"><img class="monograma" src="iniciales_difuminadas.jpg" alt="Iniciales E y F en diagonal, dentro de un círculo dorado con gerberas naranjas y fucsias"></section>
</div></div><nav class="controles" aria-label="Navegación de la tarjeta"><button class="flecha" id="anterior" aria-label="Pantalla anterior" disabled>‹</button><div class="puntos"><button class="punto" id="p0" aria-label="Mostrar primera pantalla" aria-current="step"></button><button class="punto" id="p1" aria-label="Mostrar segunda pantalla"></button><button class="punto" id="p2" aria-label="Mostrar tercera pantalla"></button></div><button class="flecha" id="siguiente" aria-label="Pantalla siguiente">›</button></nav><div class="ayuda" id="ayuda">Desliza hacia la izquierda para descubrir el recuerdo</div></main>
<script>
(()=>{let actual=0,x0=null,y0=null;const pista=document.getElementById('pista'),ventana=document.getElementById('ventana'),anterior=document.getElementById('anterior'),siguiente=document.getElementById('siguiente'),puntos=[document.getElementById('p0'),document.getElementById('p1'),document.getElementById('p2')],ayuda=document.getElementById('ayuda');function ir(n){actual=Math.max(0,Math.min(2,n));pista.style.transform=`translateX(-${actual*100}%)`;anterior.disabled=actual===0;siguiente.disabled=actual===2;puntos.forEach((p,i)=>{if(i===actual)p.setAttribute('aria-current','step');else p.removeAttribute('aria-current')});ayuda.textContent=actual===0?'Desliza para descubrir el recuerdo':actual===1?'Desliza para descubrir nuestras iniciales':'Desliza hacia la derecha para regresar'}anterior.addEventListener('click',()=>ir(actual-1));siguiente.addEventListener('click',()=>ir(actual+1));puntos.forEach((p,i)=>p.addEventListener('click',()=>ir(i)));ventana.addEventListener('touchstart',e=>{x0=e.changedTouches[0].screenX;y0=e.changedTouches[0].screenY},{passive:true});ventana.addEventListener('touchend',e=>{if(x0===null)return;const dx=e.changedTouches[0].screenX-x0,dy=e.changedTouches[0].screenY-y0;if(Math.abs(dx)>45&&Math.abs(dx)>Math.abs(dy)*1.2)ir(actual+(dx<0?1:-1));x0=y0=null},{passive:true});document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')ir(actual+1);if(e.key==='ArrowLeft')ir(actual-1)})})();
</script></body></html>

<style>.ramo,.foto,.monograma{-webkit-mask-image:none!important;mask-image:none!important;border:0!important;border-radius:0!important;box-shadow:none!important;filter:none!important}.ramo{height:auto;max-height:65svh;object-fit:contain}.foto{max-height:65svh}.monograma{max-height:75svh}</style>

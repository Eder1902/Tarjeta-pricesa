<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#2b071c"><title>Un recuerdo de amor</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{background:#180611;display:grid;place-items:center}.tarjeta{position:relative;height:100dvh;width:min(100vw,calc(100dvh * 0.707));overflow:hidden;background:#2b071c;touch-action:pan-y;outline:none}.pista{height:100%;display:flex;transition:transform .38s ease}.pagina{height:100%;min-width:100%;display:grid;place-items:center;background:#2b071c}.pagina img{display:block;width:100%;height:100%;object-fit:contain;user-select:none;-webkit-user-drag:none}.nav{position:absolute;inset:0;pointer-events:none;display:flex;justify-content:space-between;align-items:center;padding:0 4px}.nav button{pointer-events:auto;border:0;background:#24091d7a;color:#ffe4a5;border-radius:50%;font-size:22px;width:28px;height:36px;cursor:pointer;opacity:.52}.nav button:hover,.nav button:focus-visible{opacity:1}.nav button:disabled{visibility:hidden}@media(prefers-reduced-motion:reduce){.pista{transition:none}}
</style></head><body><main class="tarjeta" id="tarjeta" tabindex="0" aria-label="Tarjeta romántica deslizable de tres páginas"><div class="pista" id="pista"><section class="pagina" aria-label="Página 1: Un recuerdo de amor"><img src="01_portada_un_recuerdo_de_amor.jpg" alt="Gerberas y mensaje Un recuerdo de amor" draggable="false"></section><section class="pagina" aria-label="Página 2: Te amo, princesa"><img src="02_te_amo_princesa.jpg" alt="Fotografía de boda y mensaje Te amo, princesa" draggable="false"></section><section class="pagina" aria-label="Página 3: E y F"><img src="03_iniciales_E_y_F.jpg" alt="Iniciales E y F, flores y tercer punto iluminado" draggable="false"></section></div><nav class="nav" aria-label="Cambiar página"><button id="anterior" aria-label="Página anterior" disabled>‹</button><button id="siguiente" aria-label="Página siguiente">›</button></nav></main>
<script>
(()=>{let actual=0,inicioX=null,inicioY=null;const pista=document.getElementById('pista'),tarjeta=document.getElementById('tarjeta'),ant=document.getElementById('anterior'),sig=document.getElementById('siguiente');function ir(n){actual=Math.max(0,Math.min(2,n));pista.style.transform=`translateX(-${actual*100}%)`;ant.disabled=actual===0;sig.disabled=actual===2}ant.addEventListener('click',()=>ir(actual-1));sig.addEventListener('click',()=>ir(actual+1));tarjeta.addEventListener('touchstart',e=>{inicioX=e.changedTouches[0].clientX;inicioY=e.changedTouches[0].clientY},{passive:true});tarjeta.addEventListener('touchend',e=>{if(inicioX===null)return;let dx=e.changedTouches[0].clientX-inicioX,dy=e.changedTouches[0].clientY-inicioY;if(Math.abs(dx)>35&&Math.abs(dx)>Math.abs(dy)*1.15)ir(actual+(dx<0?1:-1));inicioX=inicioY=null},{passive:true});document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')ir(actual+1);if(e.key==='ArrowLeft')ir(actual-1)})})();
</script></body></html>
